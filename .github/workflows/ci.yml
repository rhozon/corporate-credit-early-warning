name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: CPU build of PyTorch (the CUDA wheels are not needed)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[models,dev]"
      - run: pytest -v
